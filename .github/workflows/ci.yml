name: PR1914 Linux evidence (isolated)

# Evidence only: this workflow runs on the dedicated branch
# `evidence/pr1914-linux-f8020e096-20261108` and never on main, a pull request or a merge
# group, so it cannot gate a merge or publish a product check. It checks out the production
# revision it measures separately (at the workspace root) from the harness branch that
# carries these files (under `.pr1914-harness`), builds throwaway collectors against the
# production tree, and uploads the raw outputs. `product_ci: false` in `evidence/metadata.json`.
#
# The production revision is pinned below and verified before anything runs; the harness
# checkout only contributes the three files under `.pr1914-evidence/`.
on:
  push:
    branches: [evidence/pr1914-linux-f8020e096-20261108]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr1914-linux-evidence-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Bounded, reproducible builds: two codegen jobs, no incremental state, no external
  # compiler wrapper (the empty value disables an inherited RUSTC_WRAPPER), two test
  # threads.
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: ""
  RUST_TEST_THREADS: "2"
  PRODUCTION_SHA: f8020e096f119ccf318975eb5d7ea8c8308ff62d

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The measured tree: the production revision itself, at the workspace root, so
      # `goldens::case::repo_root()` (the crate's CARGO_MANIFEST_DIR's parent) is that tree.
      - name: Checkout production revision
        uses: actions/checkout@v4
        with:
          ref: f8020e096f119ccf318975eb5d7ea8c8308ff62d
          persist-credentials: false

      - name: Verify production checkout
        run: |
          set -euo pipefail
          # Created here, after checkout's own clean, so an aborted run still records.
          mkdir -p evidence
          head_sha=$(git rev-parse HEAD)
          echo "$head_sha" | tee evidence/production-sha.txt
          if [ "$head_sha" != "$PRODUCTION_SHA" ]; then
            echo "production checkout is $head_sha, expected $PRODUCTION_SHA" >&2
            exit 1
          fi

      # The harness: exactly the pushed revision, only the three evidence files.
      - name: Checkout evidence harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .pr1914-harness
          sparse-checkout: .pr1914-evidence
          persist-credentials: false

      - name: Record revisions and harness file hashes
        run: |
          set -euo pipefail
          git -C .pr1914-harness rev-parse HEAD | tee evidence/harness-sha.txt
          echo "$GITHUB_SHA" | tee evidence/workflow-sha.txt
          sha256sum \
            .pr1914-harness/.pr1914-evidence/unit-collect.rs \
            .pr1914-harness/.pr1914-evidence/revolution_cp_probe.rs \
            .pr1914-harness/.pr1914-evidence/revolution-cp-inputs.jsonl \
            | tee evidence/harness-file-sha256.txt

      - name: Install Rust 1.98.0 (minimal)
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          rustc -Vv | tee evidence/rustc-vv.txt
          cargo -V | tee evidence/cargo-v.txt
          uname -a | tee evidence/uname.txt

      # The binaries are throwaway: they live only in this run's checkout, never in the
      # pushed harness branch.
      - name: Stage throwaway collectors into the goldens crate
        run: |
          set -euo pipefail
          mkdir -p crates/goldens/src/bin
          cp .pr1914-harness/.pr1914-evidence/unit-collect.rs crates/goldens/src/bin/unit-collect.rs
          cp .pr1914-harness/.pr1914-evidence/revolution_cp_probe.rs crates/goldens/src/bin/revolution_cp_probe.rs
          sha256sum crates/goldens/src/bin/unit-collect.rs crates/goldens/src/bin/revolution_cp_probe.rs \
            | tee evidence/staged-file-sha256.txt

      # The existing composite action (its actual file in the production tree): clones the
      # pinned upstream revision for `upstream/TestFiles`. Nothing in it is built.
      - name: Fetch upstream sources for fixtures
        uses: ./.github/actions/upstream

      - name: Build goldens and collectors (goldens profile)
        run: |
          set -o pipefail
          nice -n 10 cargo build --profile goldens -p goldens \
            --bin goldens --bin unit-collect --bin revolution_cp_probe \
            2>&1 | tee evidence/build.log

      # `unit-collect <unit id> <output.jsonl>`: writes the raw case stream, prints a JSON
      # summary on stdout. Any broken case makes it exit nonzero and fails this job.
      - name: Collect offset unit raw evidence
        run: |
          set -o pipefail
          set +e
          bin/goldens/unit-collect surface.offset_surface evidence/offset-raw.jsonl \
            2> evidence/offset-stderr.log | tee evidence/offset-summary.json
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > evidence/rc-offset.txt
          echo "unit-collect surface.offset_surface exited $rc"
          exit "$rc"

      - name: Collect approximation unit raw evidence
        run: |
          set -o pipefail
          set +e
          bin/goldens/unit-collect surface.surface_approximate evidence/approx-raw.jsonl \
            2> evidence/approx-stderr.log | tee evidence/approx-summary.json
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > evidence/rc-approx.txt
          echo "unit-collect surface.surface_approximate exited $rc"
          exit "$rc"

      # `revolution_cp_probe [input.jsonl [output.jsonl]]`: one output object per input
      # record (116 records). A malformed record or a missing input fails the step.
      - name: Probe revolution control-point objects
        run: |
          set -o pipefail
          set +e
          nice -n 10 bin/goldens/revolution_cp_probe \
            .pr1914-harness/.pr1914-evidence/revolution-cp-inputs.jsonl \
            evidence/revolution-cp-objects.jsonl \
            2>&1 | tee evidence/revolution-cp-probe.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > evidence/rc-revolution-cp-probe.txt
          wc -l evidence/revolution-cp-objects.jsonl | tee evidence/revolution-cp-objects-count.txt
          exit "$rc"

      # DIAGNOSTIC ONLY: a full all-unit goldens run. Exit 1 (golden differences) is
      # recorded, not treated as a pass of anything; exit > 1 (usage or harness setup
      # error) fails the job. This is not the product CI and never blesses goldens.
      - name: Diagnostic all-unit goldens run (not a CI pass)
        run: |
          set -o pipefail
          set +e
          nice -n 10 bin/goldens/goldens --all --goldens --jobs 2 --no-report \
            2>&1 | tee evidence/head-goldens-all.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > evidence/rc-head-goldens-all.txt
          echo "diagnostic all-unit run exited $rc"
          if [ "$rc" -gt 1 ]; then
            echo "diagnostic run exited $rc: harness or setup error (only 0 or 1 is diagnostic)" >&2
            exit "$rc"
          fi

      - name: Canonical kernel tests (solidcore, goldens profile)
        env:
          SOLIDCORE_REQUIRE_UPSTREAM: "1"
        run: |
          set -o pipefail
          set +e
          nice -n 10 cargo test -p solidcore --profile goldens --no-fail-fast \
            2>&1 | tee evidence/kernel-tests.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > evidence/rc-kernel-tests.txt
          exit "$rc"

      # Always runs: an aborted or failed step leaves its rc file absent and the
      # corresponding entries null, which the record states instead of inventing values.
      - name: Assemble evidence metadata
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          def sha(path):
              try:
                  return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              except FileNotFoundError:
                  return None

          def text(path):
              try:
                  return pathlib.Path(path).read_text()
              except FileNotFoundError:
                  return None

          def lines(path):
              try:
                  with open(path, "rb") as handle:
                      return sum(1 for _ in handle)
              except FileNotFoundError:
                  return None

          def rc(name):
              value = text(f"evidence/rc-{name}.txt")
              try:
                  return int(value.strip()) if value is not None else None
              except ValueError:
                  return None

          def summary(name):
              value = text(f"evidence/{name}-summary.json")
              if value is None:
                  return None
              start = value.rfind("{")
              try:
                  return json.loads(value[start:]) if start >= 0 else None
              except json.JSONDecodeError:
                  return None

          def git(*args):
              try:
                  return subprocess.run(
                      ["git", *args], capture_output=True, text=True, check=True
                  ).stdout.strip()
              except (subprocess.CalledProcessError, FileNotFoundError):
                  return None

          offset = summary("offset")
          approx = summary("approx")

          harness_files = [
              "unit-collect.rs",
              "revolution_cp_probe.rs",
              "revolution-cp-inputs.jsonl",
          ]
          metadata_path = pathlib.Path("evidence/metadata.json")
          artifacts = {}
          for path in sorted(pathlib.Path("evidence").rglob("*")):
              if path.is_file() and path != metadata_path:
                  artifacts[str(path)] = {
                      "sha256": sha(path),
                      "bytes": path.stat().st_size,
                  }

          metadata = {
              "evidence_only": True,
              "product_ci": False,
              "source_sha": git("rev-parse", "HEAD"),
              "source_sha_expected": "f8020e096f119ccf318975eb5d7ea8c8308ff62d",
              "workflow_sha": os.environ.get("GITHUB_SHA"),
              "workflow_ref": os.environ.get("GITHUB_REF"),
              "harness_checkout_sha": git("-C", ".pr1914-harness", "rev-parse", "HEAD"),
              "rustc_version": text("evidence/rustc-vv.txt"),
              "uname": text("evidence/uname.txt"),
              "harness_file_sha256": {
                  name: sha(f".pr1914-harness/.pr1914-evidence/{name}")
                  for name in harness_files
              },
              "staged_file_sha256": {
                  "unit-collect.rs": sha("crates/goldens/src/bin/unit-collect.rs"),
                  "revolution_cp_probe.rs": sha("crates/goldens/src/bin/revolution_cp_probe.rs"),
              },
              "production_offset_surface_sha256": sha(
                  "crates/solidcore/src/surface/offset_surface.rs"
              ),
              "exit_codes": {
                  "offset_collector": rc("offset"),
                  "approx_collector": rc("approx"),
                  "revolution_cp_probe": rc("revolution-cp-probe"),
                  "head_goldens_all_diagnostic": rc("head-goldens-all"),
                  "kernel_tests": rc("kernel-tests"),
              },
              "raw_counts": {
                  "offset_raw": lines("evidence/offset-raw.jsonl"),
                  "approx_raw": lines("evidence/approx-raw.jsonl"),
                  "revolution_cp_objects": lines("evidence/revolution-cp-objects.jsonl"),
                  "head_goldens_all_log": lines("evidence/head-goldens-all.log"),
                  "kernel_tests_log": lines("evidence/kernel-tests.log"),
              },
              "collector_summaries": {"offset": offset, "approx": approx},
              "collector_broken": {
                  "offset": None if offset is None else offset.get("broken"),
                  "approx": None if approx is None else approx.get("broken"),
              },
              "artifacts": artifacts,
          }
          metadata_path.write_text(json.dumps(metadata, indent=2) + "\n")
          print(json.dumps(metadata, indent=2))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1914-linux-evidence-${{ github.sha }}
          path: evidence/**
          if-no-files-found: error
          retention-days: 90
